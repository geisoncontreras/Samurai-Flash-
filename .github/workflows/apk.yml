name: Compilar APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'descargar/**'
      - 'servidor/**'
      - 'voces/**'
      - 'render.yaml'
      - 'privacidad/**'
      - 'eliminar-datos/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias y copiar el juego
        run: |
          npm ci
          npm run copiar-juego
          sed -i "s/__VERSION__/1.0.${GITHUB_RUN_NUMBER}/" www/index.html
          npx cap sync android

      - name: Compilar APK
        working-directory: app-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/samurai-flash.apk"

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: samurai-flash-apk
          path: samurai-flash.apk

      - name: Publicar en Releases
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view apk >/dev/null 2>&1; then
            gh release upload apk samurai-flash.apk --clobber
            gh release edit apk --notes "APK para instalar directo en Android. Se vuelve a generar con cada cambio en main. Compilado desde ${GITHUB_SHA::7}."
          else
            gh release create apk samurai-flash.apk \
              --title "Samurai Flash (APK de prueba)" \
              --notes "APK para instalar directo en Android. Se vuelve a generar con cada cambio en main. Compilado desde ${GITHUB_SHA::7}." \
              --target "$GITHUB_SHA"
          fi

      - name: Copiar APK a GitHub Pages (carpeta descargar)
        working-directory: .
        run: |
          git fetch origin main
          git checkout -B pages-apk origin/main
          cp samurai-flash.apk descargar/samurai-flash.apk
          echo "{\"n\":${GITHUB_RUN_NUMBER},\"v\":\"1.0.${GITHUB_RUN_NUMBER}\"}" > descargar/version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add descargar/samurai-flash.apk descargar/version.json
          git diff --cached --quiet || (git commit -m "APK actualizado [skip ci]" && git push origin HEAD:main)
