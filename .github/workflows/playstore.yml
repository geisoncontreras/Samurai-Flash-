name: Paquete para Play Store

# Se lanza a mano (Actions -> Paquete para Play Store -> Run workflow).
# Genera el .aab SIN firmar: la firma con la clave de subida se hace aparte,
# porque este repositorio es público y la clave no debe estar aquí.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android
    env:
      VERSION_CODE: ${{ github.run_number }}00
      VERSION_NAME: 1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar la versión de Play Store
        run: |
          npm ci
          npm run copiar-juego
          sed -i "s/__VERSION__/${VERSION_NAME}/" www/index.html
          # los 3 animales solo se liberan venciendo al retador
          sed -i "s/const CHAL_ON=false;/const CHAL_ON=true;/" www/index.html
          grep -q "const CHAL_ON=true;" www/index.html
          # la Temporada 2 y sus 11 personajes solo se liberan con la compra en Google Play
          sed -i "s/const PAY_ON=false;/const PAY_ON=true;/" www/index.html
          grep -q "const PAY_ON=true;" www/index.html
          # Play Store no permite que la app se actualice sola: se quita el actualizador
          sed -i "s/setTimeout(updCheck,1500);//" www/index.html
          ! grep -q "setTimeout(updCheck,1500)" www/index.html
          M=android/app/src/main/AndroidManifest.xml
          sed -i '/REQUEST_INSTALL_PACKAGES/d;/InstalarReceiver/d' $M
          sed -i '/registerPlugin(ActualizarPlugin.class);/d' android/app/src/main/java/com/samuraiflash/juego/MainActivity.java
          rm android/app/src/main/java/com/samuraiflash/juego/ActualizarPlugin.java android/app/src/main/java/com/samuraiflash/juego/InstalarReceiver.java
          ! grep -rq "REQUEST_INSTALL_PACKAGES\|ActualizarPlugin" android/app/src/main
          npx cap sync android

      - name: Compilar el paquete (.aab)
        working-directory: app-android/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/samurai-flash-play-sin-firmar.aab"

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: samurai-flash-play
          path: samurai-flash-play-sin-firmar.aab

      - name: Publicar en Releases (playstore)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N="Paquete para Play Store sin firmar, versión ${VERSION_NAME} (código ${VERSION_CODE}), desde ${GITHUB_SHA::7}. Hay que firmarlo con la clave de subida antes de subirlo."
          if gh release view playstore >/dev/null 2>&1; then
            gh release upload playstore samurai-flash-play-sin-firmar.aab --clobber
            gh release edit playstore --notes "$N"
          else
            gh release create playstore samurai-flash-play-sin-firmar.aab --title "Samurai Flash (Play Store)" --notes "$N" --target "$GITHUB_SHA" --prerelease
          fi
